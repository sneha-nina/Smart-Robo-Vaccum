<section class="selector-card">
  <div class="selector-copy">
    <p class="selector-kicker">Power Mode</p>
    <h3>Adjust suction intensity</h3>
  </div>

  <div class="selector-row">
    @for (option of options; track option.key) {
      <button
        type="button"
        class="power-option"
        [class.power-option-active]="selectedMode() === option.key"
        (click)="modeSelected.emit(option.key)"
      >
        <span class="power-label">{{ option.label }}</span>
        <span class="power-description">{{ option.description }}</span>
      </button>
    }
  </div>
</section>
